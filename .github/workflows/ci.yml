name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: |
          poetry run pytest -q

      - name: Run demo - similar regime
        env:
          DATA_DIR: data
        run: |
          poetry run python examples/demo_similar_regime.py

      - name: Run demo - new regime
        env:
          DATA_DIR: data
        run: |
          poetry run python examples/demo_new_regime.py
